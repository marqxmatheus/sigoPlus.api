name: sigo-plus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sigo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrations:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sigo}?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-sigo}
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seeds/minimum.sql"]
    volumes:
      - ./seeds:/seeds:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      PORT: 8080
      GIN_MODE: debug
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sigo}?sslmode=disable
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    volumes:
      - .:/app
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    init: true

  web:
    build:
      context: ../sigoPlus.web
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../sigoPlus.web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    init: true

volumes:
  postgres_data:
  web_node_modules:
